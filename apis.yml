name: MediaSpike
description: >-
  MediaSpike was an AdTech startup founded in 2011 by Blake Commagere and headquartered in Mountain
  View, California, that built a native monetization platform for dynamic, programmatic product
  placement inside social, mobile, and virtual-reality games. Its API let game developers surface
  contextual in-game sponsorships and brand placements, and the network reportedly reached roughly 20
  million unique users at its peak. Backed by Andreessen Horowitz (a16z), Google Ventures, CMEA
  Capital, 500 Startups, and others (a $5.2M Series A in November 2013), the company ceased operations
  around June 2017. mediaspike.com no longer hosts the product and currently serves only a "coming
  soon" placeholder; no live API, developer portal, or discovery surface remains.
